<style>
:root {
  --bg: #fafafa;

  --text: #1a1a1a;

  --shadow: 0 4px 12px rgba(0,0,0,0.06);

  --status-active: #22c55e;
  --status-beta: #eab308;
  --status-broken: #ef4444;
}
@media (prefers-color-scheme: dark) {
  :root {

    --card-bg: #161616;
    --text: #fafafa;

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", sans-serif;

  padding: 2.5rem 1.25rem 4rem;

  -webkit-font-smoothing: antialiased;
}
.container { max-width: 1100px; margin: 0 auto; }
header { margin-bottom: 2rem; }
h1 {
  font-size: 1.85rem;

  margin-bottom: 0.4rem;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 0.55rem;
}
.title-icon {
  display: inline-flex;
  align-items: center;
  color: var(--accent);
  flex-shrink: 0;
}
.tagline {

}
.search-wrap {

}
.search {

  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);

  transition: border-color 0.15s, box-shadow 0.15s;
  font-family: inherit;
}
.search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}
.search-icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-secondary);
  pointer-events: none;
  font-size: 1.1rem;
}
.kbd {
  position: absolute;
  right: 1rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.6875rem;
  padding: 0.15rem 0.45rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text-secondary);
  font-family: var(--mono);
}
.section { margin-bottom: 2.25rem; }
.section-title {
  font-size: 0.6875rem;

  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-secondary);
  margin-bottom: 0.85rem;
  padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.cat-icon {
  display: inline-flex;
  align-items: center;
  color: var(--text-secondary);
  flex-shrink: 0;
  letter-spacing: normal;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 0.85rem;
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1rem 1.1rem;
  text-decoration: none;
  color: inherit;
  transition: transform 0.15s ease, border-color 0.15s, box-shadow 0.15s;
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 1rem;
  cursor: pointer;
  outline: none;
}
.card-body {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  flex: 1;
  min-width: 0;
}
.card:focus-visible {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}
.card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.card-header {
  display: flex;
  align-items: center;
  gap: 0.55rem;
}
.card-title {
  font-weight: 600;
  font-size: 1rem;

.favicon {

  border-radius: 4px;

  border: 1px solid var(--border);

}
.extras {

  gap: 0.3rem;

.extra-link {

  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 5px;
  color: var(--text-secondary);
  background: transparent;
  border: 1px solid transparent;
  text-decoration: none;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.extra-link:hover {
  background: var(--bg);
  color: var(--accent);
  border-color: var(--border);
}
.status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status.active { background: var(--status-active); box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.15); }
.status.beta { background: var(--status-beta); box-shadow: 0 0 0 2px rgba(234, 179, 8, 0.15); }
.status.broken { background: var(--status-broken); box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.15); }
.card-desc {
  font-size: 0.875rem;
  color: var(--text-secondary);
  line-height: 1.5;
  flex-grow: 1;
}
.card-footer {
  margin-top: 0.55rem;
  display: flex;
  gap: 0.35rem;
  flex-wrap: wrap;

footer {

@media (max-width: 600px) {

// 分類顯示順序(沒列到的會自動排在最後)
// 分類邏輯:教學兩區按「情境」分,其餘按「誰會用」分 — 師生 / 教師 / 只有資媒組

function renderIcon(name, size) {
  const p = iconPaths[name];
  if (!p) return "";
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}

// ============================================================
// 渲染與搜尋邏輯
// ============================================================
const tagLabels = {
  "vercel": "Vercel",
  "apps-script": "Apps Script",
  "local": "本機",
  "gh-pages": "GitHub Pages"
};

// 依搜尋字串過濾
function matchTools(filter = "") {
  const f = filter.toLowerCase().trim();
  return tools.filter(t =>
    !f ||
    t.title.toLowerCase().includes(f) ||
    t.desc.toLowerCase().includes(f) ||
    t.tag.toLowerCase().includes(f) ||
    t.category.toLowerCase().includes(f) ||
    (tagLabels[t.tag] || "").toLowerCase().includes(f)
  );
}

// 過濾 + 排序成「畫面上的顯示順序」:
// 分類按 categoryOrder(沒列到的排最後),分類內依點擊數高→低,
// 常用工具自動浮上來;點擊數相同時保持 tools 陣列原順序
function getDisplayList(filter = "") {
  const filtered = matchTools(filter);
  const cats = [...new Set(filtered.map(t => t.category))];
  cats.sort((a, b) => {
    const ia = categoryOrder.indexOf(a);
    const ib = categoryOrder.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  return cats.map(cat => ({
    cat,
    items: filtered
      .filter(t => t.category === cat)
      .sort((a, b) => getClickCount(b.url) - getClickCount(a.url))
  }));
}

function render(filter = "") {
  const content = document.getElementById("content");
  const groups = getDisplayList(filter);

  if (groups.length === 0) {
    content.innerHTML = '<div class="empty">沒有符合的工具。試試別的關鍵字?</div>';
    return;
  }

  let html = "";
  for (const { cat, items } of groups) {
    const icon = categoryIcons[cat] ? `<span class="cat-icon" aria-hidden="true">${renderIcon(categoryIcons[cat], 16)}</span>` : "";
    html += `<section class="section"><div class="section-title">${icon}${escapeHtml(cat)}</div><div class="grid">`;
    for (const t of items) {
      const tagLabel = tagLabels[t.tag] || t.tag;
      const favicon = getFavicon(t.url);
      const clicks = getClickCount(t.url);
      // 有設 icon 就用專屬 SVG 圖示,否則退回 favicon
      const iconHtml = t.icon
        ? `<span class="card-icon">${renderIcon(t.icon, 48)}</span>`
        : (favicon ? `<img class="favicon" src="${escapeAttr(favicon)}" alt="" onerror="this.style.display='none'">` : "");
      const extras = [];
      // dataUrl 支援字串 OR 陣列 [{url, label}, ...]
      const dataLinks = !t.dataUrl ? []
        : Array.isArray(t.dataUrl) ? t.dataUrl
        : [{ url: t.dataUrl, label: "原始資料 (Sheet)" }];
      dataLinks.forEach(d => {
        const label = d.label || "原始資料 (Sheet)";
        extras.push(`<a class="extra-link" href="${escapeAttr(d.url)}" target="_blank" rel="noopener noreferrer" title="${escapeAttr(label)}" aria-label="${escapeAttr(label)}">${renderIcon("sheet", 14)}</a>`);
      });
      if (t.codeUrl) extras.push(`<a class="extra-link" href="${escapeAttr(t.codeUrl)}" target="_blank" rel="noopener noreferrer" title="原始碼 / 編輯器" aria-label="原始碼">${renderIcon("code", 14)}</a>`);
      const extrasHtml = extras.length ? `<div class="extras">${extras.join("")}</div>` : "";
      html += `<div class="card" data-url="${escapeAttr(t.url)}" tabindex="0" role="link" aria-label="${escapeAttr(t.title)}">
        ${iconHtml}
        <div class="card-body">
          <div class="card-header">
            <div class="card-title">${escapeHtml(t.title)}</div>
            <div class="status ${t.status}" title="${t.status}"></div>
          </div>
          <div class="card-desc">${escapeHtml(t.desc)}</div>
          <div class="card-footer">
            <span class="tag ${t.tag}">${escapeHtml(tagLabel)}</span>
            ${extrasHtml}
            ${clicks > 0 ? `<span class="click-count" title="點擊次數">↗ ${clicks}</span>` : ""}
          </div>
        </div>
      </div>`;
    }
    html += `</div></section>`;
  }
  content.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

// Favicon — 用 Google 的 favicon 服務,localhost 用內嵌 SVG
const LOCAL_ICON = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 10l3 3-3 3M13 16h4"/></svg>'
);
function getFavicon(url) {
  try {
    const u = new URL(url);
    if (u.hostname === "localhost" || u.hostname.startsWith("127.")) return LOCAL_ICON;
    return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64`;
  } catch { return null; }
}

// 點擊次數 — localStorage,key 用 url
// 包 try/catch:localStorage 不可用時(無痕模式等)寧可不記數,也不能擋住開連結
function getClickCount(url) {
  try {
    return parseInt(localStorage.getItem("clicks_" + url) || "0", 10);
  } catch { return 0; }
}
function incrementClickCount(url) {
  try {
    localStorage.setItem("clicks_" + url, String(getClickCount(url) + 1));
  } catch { /* 記不了就算了 */ }
}

// ============================================================
// 互動:搜尋 + 鍵盤快捷鍵
// ============================================================
const search = document.getElementById("search");
search.addEventListener("input", e => render(e.target.value));

// Enter 直接開「畫面上第一個」結果 — launcher 動線:/ → 關鍵字 → Enter
search.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const groups = getDisplayList(search.value);
  if (groups.length === 0 || groups[0].items.length === 0) return;
  const first = groups[0].items[0];
  incrementClickCount(first.url);
  window.open(first.url, "_blank", "noopener,noreferrer");
  setTimeout(() => render(search.value), 0);
});

// 點卡片時:打開主入口 + 記次數;若點到的是 .extra-link 則放行,讓那個 <a> 自己處理
function handleCardActivate(target) {
  if (target.closest(".extra-link")) return; // 額外連結自己有 href,不要擋
  const card = target.closest(".card");
  if (!card || !card.dataset.url) return;
  incrementClickCount(card.dataset.url);
  window.open(card.dataset.url, "_blank", "noopener,noreferrer");
  setTimeout(() => render(search.value), 0);
}

const contentEl = document.getElementById("content");
contentEl.addEventListener("click", e => handleCardActivate(e.target));
contentEl.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    const card = e.target.closest(".card");
    if (card && card === e.target) {
      e.preventDefault();
      handleCardActivate(e.target);
    }
  }
});

document.addEventListener("keydown", e => {
  // 按 / 聚焦搜尋框
  if (e.key === "/" && document.activeElement !== search) {
    e.preventDefault();
    search.focus();
    search.select();
  }
  // 按 Esc 清空並失焦
  if (e.key === "Escape" && document.activeElement === search) {
    search.value = "";
    render();
    search.blur();
  }
});

// 「最後更新」自動抓 GitHub 最後 commit 時間,不用手動維護
// 離線或 API 限流時優雅降級:只顯示工具數
const lastUpdatedEl = document.getElementById("last-updated");
lastUpdatedEl.textContent = "共 " + tools.length + " 項工具";
fetch("https://api.github.com/repos/ivanchen114/ivanchen114.github.io/commits?per_page=1")
  .then(r => r.ok ? r.json() : Promise.reject(new Error("API " + r.status)))
  .then(commits => {
    const iso = commits?.[0]?.commit?.committer?.date;
    if (!iso) return;
    const d = new Date(iso);
    const pad = n => String(n).padStart(2, "0");
    lastUpdatedEl.textContent =
      `最後更新:${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}　·　共 ${tools.length} 項工具`;
  })
  .catch(() => {});

render();
</script>
